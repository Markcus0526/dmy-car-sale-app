name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  frontend:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: csm
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -uroot -ptest --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      # --default-character-set=utf8mb4 is not optional. Without it the client
      # connection can negotiate a narrower charset and 4-byte characters are
      # silently mangled on the way in -- which is exactly the failure mode
      # cmd/migrate-data must never hit.
      - name: Apply 0001 (schema)
        run: mysql -h127.0.0.1 -P3306 -uroot -ptest csm --default-character-set=utf8mb4 < migrations/0001_init.up.sql

      - name: Apply 0002 (foreign keys)
        run: mysql -h127.0.0.1 -P3306 -uroot -ptest csm --default-character-set=utf8mb4 < migrations/0002_foreign_keys.up.sql

      - name: Apply 0003 (password_bcrypt)
        run: mysql -h127.0.0.1 -P3306 -uroot -ptest csm --default-character-set=utf8mb4 < migrations/0003_password_bcrypt.up.sql

      - name: Apply 0004 (sessions)
        run: mysql -h127.0.0.1 -P3306 -uroot -ptest csm --default-character-set=utf8mb4 < migrations/0004_sessions.up.sql

      - name: Assert shape
        run: |
          q() { mysql -h127.0.0.1 -P3306 -uroot -ptest csm -N -B -e "$1"; }
          tables=$(q "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='csm';")
          rowver=$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='csm' AND column_name='row_version';")
          fks=$(q    "SELECT COUNT(*) FROM information_schema.table_constraints WHERE table_schema='csm' AND constraint_type='FOREIGN KEY';")
          # 5 from 0002 + tbl_session -> tbl_userinfo
          echo "tables=$tables row_version=$rowver fks=$fks"
          [ "$tables" = 16 ] || { echo "::error::expected 16 tables (15 + tbl_session), got $tables"; exit 1; }
          [ "$rowver" = 15 ] || { echo "::error::expected row_version on all 15 tables, got $rowver"; exit 1; }
          [ "$fks"    = 6  ] || { echo "::error::expected 6 foreign keys, got $fks"; exit 1; }

          # A bcrypt hash is exactly 60 chars. A wider column would silently
          # accept something that is not a bcrypt hash.
          len=$(q "SELECT character_maximum_length FROM information_schema.columns WHERE table_schema='csm' AND table_name='tbl_userinfo' AND column_name='password_bcrypt';")
          [ "$len" = 60 ] || { echo "::error::password_bcrypt should be VARCHAR(60), got $len"; exit 1; }

          # Deliberately non-unique: the legacy data has never been constrained.
          uniq=$(q "SELECT non_unique FROM information_schema.statistics WHERE table_schema='csm' AND table_name='tbl_userinfo' AND index_name='idx_tbl_userinfo_username';")
          [ "$uniq" = 1 ] || { echo "::error::username index must not be UNIQUE until the data is known clean"; exit 1; }

      # 0003 rolls back independently of 0001; 0001's down drops the whole
      # table and would mask a broken 0003 down.
      - name: 0003 down reverses cleanly
        run: |
          q() { mysql -h127.0.0.1 -P3306 -uroot -ptest csm -N -B -e "$1"; }
          mysql -h127.0.0.1 -P3306 -uroot -ptest csm --default-character-set=utf8mb4 < migrations/0003_password_bcrypt.down.sql
          col=$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='csm' AND table_name='tbl_userinfo' AND column_name='password_bcrypt';")
          idx=$(q "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema='csm' AND table_name='tbl_userinfo' AND index_name='idx_tbl_userinfo_username';")
          [ "$col" = 0 ] && [ "$idx" = 0 ] || { echo "::error::0003 down left col=$col idx=$idx"; exit 1; }
          mysql -h127.0.0.1 -P3306 -uroot -ptest csm --default-character-set=utf8mb4 < migrations/0003_password_bcrypt.up.sql

      # A migration you cannot roll back is not a migration.
      - name: Down migration leaves nothing behind
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -ptest csm --default-character-set=utf8mb4 < migrations/0001_init.down.sql
          left=$(mysql -h127.0.0.1 -P3306 -uroot -ptest csm -N -B -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='csm';")
          [ "$left" = 0 ] || { echo "::error::down left $left tables behind"; exit 1; }

      - name: Re-apply (migrations are repeatable)
        run: |
          for f in 0001_init.up 0002_foreign_keys.up 0003_password_bcrypt.up 0004_sessions.up; do
            mysql -h127.0.0.1 -P3306 -uroot -ptest csm --default-character-set=utf8mb4 < "migrations/$f.sql"
          done

      # Guards D17: a session cannot be duplicated, cannot be orphaned, and
      # dies with its user. Revocability is the whole reason for a session
      # table rather than a JWT.
      - name: Behaviour — sessions
        run: |
          q() { mysql -h127.0.0.1 -P3306 -uroot -ptest csm -N -B --default-character-set=utf8mb4 -e "$1"; }
          uid=$(q "INSERT INTO tbl_userinfo (departmentcode,username) VALUES ('D1','zhangsan');
                   SELECT LAST_INSERT_ID();")
          q "INSERT INTO tbl_session (userinfoid,token_hash,created_at,last_seen_at,expires_at)
             VALUES ($uid,REPEAT('a',64),NOW(),NOW(),NOW()+INTERVAL 24 HOUR);"

          if q "INSERT INTO tbl_session (userinfoid,token_hash,created_at,last_seen_at,expires_at)
                VALUES ($uid,REPEAT('a',64),NOW(),NOW(),NOW());" 2>/dev/null; then
            echo "::error::duplicate token_hash was accepted"; exit 1
          fi

          if q "INSERT INTO tbl_session (userinfoid,token_hash,created_at,last_seen_at,expires_at)
                VALUES (999,REPEAT('b',64),NOW(),NOW(),NOW());" 2>/dev/null; then
            echo "::error::a session for a non-existent user was accepted"; exit 1
          fi

          left=$(q "DELETE FROM tbl_userinfo WHERE uid=$uid; SELECT COUNT(*) FROM tbl_session;")
          [ "$left" = 0 ] || { echo "::error::deleting a user left $left sessions behind"; exit 1; }
          echo "ok sessions: unique, FK-guarded, cascade on user delete"

      # Guards the two decisions baked into 0001: optimistic concurrency, and
      # utf8mb4 storing 4-byte characters intact.
      - name: Behaviour — row_version and utf8mb4
        run: |
          out=$(mysql -h127.0.0.1 -P3306 -uroot -ptest csm -N -B --default-character-set=utf8mb4 <<'SQL'
          -- Uses LAST_INSERT_ID(), not a hardcoded uid: an earlier step deletes
          -- a user, so AUTO_INCREMENT has already moved past 1 and `WHERE uid=1`
          -- would match nothing and fail for the wrong reason.
          INSERT INTO tbl_userinfo (departmentcode, departmentname, username) VALUES ('D1','销售部','张三');
          SET @uid = LAST_INSERT_ID();
          UPDATE tbl_userinfo SET username='李四', row_version=row_version+1 WHERE uid=@uid AND row_version=1;
          SELECT IF(ROW_COUNT()=1,'ok fresh-update','FAIL fresh update was rejected');
          UPDATE tbl_userinfo SET username='王五', row_version=row_version+1 WHERE uid=@uid AND row_version=1;
          SELECT IF(ROW_COUNT()=0,'ok stale-update-blocked','FAIL stale update overwrote a newer row');
          INSERT INTO tbl_basedata (type,name,keyname,value) VALUES (1,'车系列','民用','测试𠮷');
          SELECT IF(CHAR_LENGTH(value)=3 AND LENGTH(value)=10,'ok utf8mb4-4byte','FAIL 4-byte character was mangled') FROM tbl_basedata;
          SQL
          )
          echo "$out"
          if echo "$out" | grep -q FAIL; then
            echo "::error::behavioural assertion failed (see above)"
            exit 1
          fi
          [ "$(echo "$out" | grep -c '^ok ')" = 3 ] || {
            echo "::error::expected 3 assertions, got $(echo "$out" | grep -c '^ok ')"; exit 1; }

  i18n:
    name: i18n catalogues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Every legacy source must decode with no U+FFFD and an unchanged CJK
      # codepoint sequence. Writes nothing; the reference tree is regenerable
      # and not committed.
      - name: Encoding conversion is lossless
        run: node tools/convert-encoding/convert.mjs --check

      # Placeholder integrity is the check that matters most here: a dropped
      # {0:0} is a runtime FormatException, not a visible typo.
      - name: Verify app catalogue
        run: node tools/extract-strings/verify.mjs web/src/locales/zh-CN.json web/src/locales/en.json

      - name: Verify extracted catalogue
        run: node tools/extract-strings/verify.mjs docs/i18n/zh-CN.extracted.json docs/i18n/en.extracted.json

      # Re-derive the catalogue from the C# source. A diff means the legacy
      # source changed, or someone hand-edited generated output — both need a
      # human, and neither should reach a screen silently.
      - name: Extraction is reproducible
        run: |
          node tools/extract-strings/extract.mjs
          if ! git diff --quiet -- docs/i18n/zh-CN.extracted.json; then
            echo "::error::zh-CN.extracted.json is stale — re-run tools/extract-strings/extract.mjs and commit"
            git diff -- docs/i18n/zh-CN.extracted.json
            exit 1
          fi
