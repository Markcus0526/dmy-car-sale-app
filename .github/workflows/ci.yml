name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  frontend:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  i18n:
    name: i18n catalogues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Placeholder integrity is the check that matters most here: a dropped
      # {0:0} is a runtime FormatException, not a visible typo.
      - name: Verify app catalogue
        run: node tools/extract-strings/verify.mjs web/src/locales/zh-CN.json web/src/locales/en.json

      - name: Verify extracted catalogue
        run: node tools/extract-strings/verify.mjs docs/i18n/zh-CN.extracted.json docs/i18n/en.extracted.json

      # Re-derive the catalogue from the C# source. A diff means the legacy
      # source changed, or someone hand-edited generated output — both need a
      # human, and neither should reach a screen silently.
      - name: Extraction is reproducible
        run: |
          node tools/extract-strings/extract.mjs
          if ! git diff --quiet -- docs/i18n/zh-CN.extracted.json; then
            echo "::error::zh-CN.extracted.json is stale — re-run tools/extract-strings/extract.mjs and commit"
            git diff -- docs/i18n/zh-CN.extracted.json
            exit 1
          fi
